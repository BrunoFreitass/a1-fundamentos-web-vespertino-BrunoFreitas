<!-- Formulário com action e method -->
<form action="#" method="POST">
    
    <fieldset>
        <legend>Dados Pessoais</legend>
        
        <!-- 1, 2 e 3: label for=id, required, minlength e maxlength -->
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" required minlength="3" maxlength="50">
        <br><br>

        <!-- 1 e 2: label for=id e required -->
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <!-- 4: Expressão Regular (pattern) e dica (title) -->
        <!-- O pattern exige o formato exato 99 99999-9999 -->
        <label for="telefone">Telefone (Whatsapp):</label>
        <input type="tel" id="telefone" name="telefone" required pattern="[0-9]{2} [0-9]{5}-[0-9]{4}" title="Formato exigido: DDD XXXXX-XXXX (ex: 95 98116-2474)">
    </fieldset>

    <br>

    <fieldset>
        <legend>Detalhes do Pedido</legend>

        <!-- 1, 2 e 3: label for=id, required, min e max -->
        <label for="quantidade">Quantidade de Pessoas:</label>
        <input type="number" id="quantidade" name="quantidade" required min="1" max="10">
        <br><br>

        <label for="pacote">Escolha o Pacote:</label>
        <select id="pacote" name="pacote" required>
            <option value="">Selecione uma opção...</option>
            <option value="roraima">Pacote Roraima</option>
            <option value="ifrr">Cenário IFRR</option>
        </select>
        <br><br>

        <!-- label e input pareados perfeitamente no checkbox -->
        <input type="checkbox" id="termos" name="termos" required>
        <label for="termos">Concordo com os termos e condições</label>
    </fieldset>

    <br>

    <button type="submit">Enviar Formulário</button>
    
</form>
